summary: >-
  I have supervised {{ stats.supervision.phd_words }} PhD student{{ 's' if stats.supervision.phd != 1 }},
  {{ stats.supervision.masters_words }} Master's students, and
  {{ stats.supervision.junior_words }} undergraduate or junior research projects, and I
  deliver graduate lectures in dark matter and particle physics. My mentoring model is
  to give students a self-contained piece of a larger program, with a clear path to
  publication. My Melbourne PhD student's work on sub-GeV atmospheric CP violation grew directly
  into a paper, and my former Bachelor student Kruteesh Desai went on to lead a
  published dark matter search with IceCube and P-ONE.

