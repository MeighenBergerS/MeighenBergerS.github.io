summary: >-
  I have mentored {{ stats.supervision.phd_words }} PhD student{{ 's' if stats.supervision.phd != 1 }} and
  co-supervised {{ stats.supervision.masters_words }} Master's students and
  {{ stats.supervision.junior_words }} undergraduate or junior research projects, and I
  deliver graduate lectures in dark matter and particle physics. My mentoring model is
  to give students a self-contained piece of a larger program, with a clear path to
  publication. A PhD student I mentor reproduced all simulations of our
  [framework for measuring sub-GeV atmospheric CP violation](https://arxiv.org/abs/2605.16721)
  and helped derive its analytical results, and a student whose Bachelor's project I
  co-supervised went on to lead a
  [published dark matter search with IceCube and P-ONE](https://arxiv.org/abs/2302.10542).

lecturing:
  - "**Lecturer**, University of Iowa. Dark Matter Direct Detection (graduate lectures)."
  - "**Teaching Assistant**, TUM. Experimental Physics 1, 3, and 4, and Theoretical Mechanics (summer course), 2018 to 2020."

# Counts of mentored students per level. The names live in private/private.yml
