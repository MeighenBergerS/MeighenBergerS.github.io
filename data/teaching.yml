supervision: {phd: 3, masters: 3, junior: 3}

community:
  - "**Group infrastructure.** Two open tools support research training. **nestling** ([GitHub](https://github.com/MeighenBergerS/nestling)) is an onboarding framework for new students, and **jc-ppi** ([GitHub](https://github.com/MeighenBergerS/jc-ppi)) runs a journal club."
