# Your notes on papers. Metadata (authors, journal, citations, arXiv) comes from
# INSPIRE automatically; this file only holds what no API knows.
#
# Keys are INSPIRE texkeys (or keys in papers_extra.bib for non-INSPIRE papers).
# Listed papers form "major contributions": the CV publication list and the
# research page. Papers on INSPIRE with few authors that are neither listed here
# nor in `hidden` are reported as "needs review" by the build.
#
#   roles:        standard contribution tags, any of
#                   wrote     -> "Wrote the paper" (sole author) / "Co-wrote the paper"
#                   idea      -> "Developed the idea" (had the idea or helped develop it)
#                   mentored  -> "Mentored student" (a student worked on it and/or led it)
#   details:      specific statement of what you did, for smaller contributions;
#                 shown after the tags. Ignored when `idea` is set: developing the
#                 idea needs no further description.
#   themes:       ids from research.yml
#   status:       override sub/pub/proc/preprint (normally derived from INSPIRE);
#                 preprint = arXiv only, not submitted anywhere
#   cv:           false -> on the website only, not in the CV list. Proceedings
#                 (status proc) are never in the CV list.
#   accepted:     {journal: Phys. Rev. D, doi: 10.1103/...} for a paper accepted
#                 before INSPIRE lists the journal; shown as published (accepted).
#                 The build asks you to remove it once INSPIRE has the journal.

