# Two-sentence pitch at the top of the home page: what you do and what sets you apart.
pitch: >-
  I find the measurements next-generation neutrino detectors weren't designed for, and
  show they can make them. These range from leptonic CP violation with atmospheric
  neutrinos to new probes of dark matter. Having worked inside IceCube, P-ONE and Borexino, I build the
  transport and simulation tools that make these predictions hold up at the detector level.

# Home-page highlight cards: one result each, with a figure from the paper (arXiv
# source). `paper` is a key from papers.yml; the link and venue come from INSPIRE.
highlights:
  - paper: Beacom:2026mys
    title: CP violation with atmospheric neutrinos
    result: Sub-GeV atmospheric neutrinos give Hyper-K and DUNE a measurement of the CP-violating phase that is independent of accelerator systematics.
    figure: img/highlights/cp-phase.jpg
    alt: Oscillogram of the appearance probability versus neutrino energy and zenith angle, with the analysis region of interest marked.
  - paper: Meighen-Berger:2023xpr
    title: $\nu_\tau$ appearance in JUNO
    result: A new neutral-current signature lets JUNO observe atmospheric $\nu_\tau$ appearance at 5$\sigma$, at energies no other experiment reaches.
    figure: img/highlights/juno-tau.png
    alt: Bar chart of expected significance. JUNO reaches 5 sigma in five years, above KamLAND, SK, DeepCore and IceCube.
  - paper: Meighen-Berger:2025hrq
    title: Dark matter from cosmic-ray accelerators
    result: The existence of ultrahigh-energy cosmic rays constrains dark matter-proton scattering, probing sub-GeV masses that direct detection cannot reach.
    figure: img/highlights/uhecr-dm.png
    alt: Exclusion plot of the dark matter-proton cross section versus dark matter mass, with the new NGC 1068 and Milky Way bounds.
  - paper: Lazar:2023rol
    title: Prometheus, open neutrino-telescope simulation
    result: The first public end-to-end simulation for neutrino telescopes in ice and water, now a community baseline.
    figure: img/highlights/prometheus.png
    alt: Diagram of the Prometheus simulation chain from particle injection through propagation and light yield to photon detection.

# One-paragraph version (CV page and fallback).
bio: >-
  I am a phenomenologist working at the interface of neutrino physics, dark matter,
  and astroparticle theory. I develop the theoretical frameworks that turn
  next-generation neutrino detectors into precision instruments for fundamental
  physics, and the open simulation tools that make those predictions testable.
  I am currently a postdoctoral fellow at the University of Iowa and an affiliate
  at Fermilab.

# Longer version used as "Research Profile" on the CV.
research_profile: >-
  I am a phenomenologist working on neutrino and dark matter physics. I find the
  measurements next-generation neutrino detectors weren't designed for, and show they
  can make them. My work has two main directions. The first is new measurements with
  neutrinos, from leptonic CP violation with sub-GeV atmospheric neutrinos to
  $\nu_\tau$ appearance in JUNO and neutral-current solar neutrinos in DUNE. The second
  is new probes of dark matter and physics beyond the Standard Model, with the same
  detectors and with astrophysical systems. Both rest on particle transport, atmospheric fluxes, and
  detector modelling that I build into open tools now used across the field, and on
  direct experience inside the IceCube, P-ONE, and Borexino collaborations, which
  keeps the predictions honest about backgrounds and systematics. The phenomenology
  targets JUNO, Hyper-K, DUNE, KM3NeT, IceCube, and P-ONE.

collaborations: >-
  **Collaboration membership.** P-ONE (2019 to present) and IceCube (2017 to 2023),
  contributing atmospheric-cascade and bioluminescence background modelling, dark
  matter and new-physics analyses. Earlier work with Borexino on cosmic muon
  modulations.
