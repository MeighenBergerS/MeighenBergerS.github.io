# CV content that is not papers, talks, software or teaching.
# Text fields use light Markdown: **bold**, *italic*, [text](url).

highlights:
  # Rendered as a template: {{ stats.* }} values are computed at build time.
  - >-
    **New measurement channels.** Proposed and developed the phenomenological
    frameworks behind several new measurement strategies. These include leptonic CP
    violation with sub-GeV atmospheric neutrinos, atmospheric tau-neutrino appearance
    via neutral currents in JUNO, neutral-current solar neutrino detection in DUNE,
    and dark matter searches using Jupiter as a target.
  - >-
    **Theory and BSM physics.** Independent theoretical work on dark matter and physics
    beyond the Standard Model, including long-lived supersymmetric particles, dark
    matter-nucleon interactions constrained by ultrahigh-energy cosmic ray
    acceleration, and dark matter energy exchange in stars orbiting supermassive black
    holes.
  - >-
    **Inside the experiments.** Collaboration member of IceCube, P-ONE, and Borexino,
    providing the atmospheric-cascade and bioluminescence background models their
    analyses depend on. My phenomenology for Hyper-K, DUNE, JUNO, and KM3NeT is
    independent of those collaborations, but is built on that experience.
  - >-
    **Community software.** Lead developer and maintainer of **Prometheus**, the
    open-source neutrino telescope simulation now used across the field, and author of
    **Fennel** and **Fourth Day**.
  - >-
    **Independent visibility.** {{ stats.invited_talks }} invited talks and seminars,
    including Stanford, Harvard, Texas A&M, Ohio State, UNSW, and the Mitchell
    Conference.
  - >-
    **Mentoring.** Supervised {{ stats.supervision.phd_words }} PhD student{{ 's' if stats.supervision.phd != 1 }},
    {{ stats.supervision.masters_words }} Master's students, and
    {{ stats.supervision.junior_words }} undergraduate or junior researchers. Graduate
    lecturer in dark matter direct detection. Organized the Melbourne theory seminar
    series.
  - >-
    **Funding and recognition.** Marie Curie Seal of Excellence (2021), Laby Early
    Career Researcher Award, and an ARC Centre of Excellence for Dark Matter ECR Special
    Initiatives grant.

