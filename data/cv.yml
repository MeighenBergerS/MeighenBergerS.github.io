interdisciplinary:
  intro: >-
    The methods I develop for particle transport and Monte Carlo simulation transfer
    beyond particle physics. The deep-sea optical work below is the origin of Fourth
    Day and of the optical background model P-ONE relies on.
  items:
    - title: Polychromatic Population of Bioluminescent Organisms in the Deep Pacific Ocean
      year: 2026
      text: Four years of STRAW camera and PMT data in the Cascadia Basin, characterizing the chromatic, temporal, and tidal structure of deep-sea bioluminescence.
      url: https://essopenarchive.org/doi/full/10.22541/essoar.15002512/v1
      link_label: link
    - title: Bioluminescence Modeling for Deep Sea Experiments
      year: 2021
      text: Simulation framework coupling water currents to organism light emission, released as the Fourth Day code.
      url: https://arxiv.org/abs/2103.03816
      link_label: arXiv
    - title: Two-Year Optical Site Characterization for the Pacific Ocean Neutrino Experiment (P-ONE) in the Cascadia Basin
      year: 2021
      text: Deep-sea optical characterization establishing the P-ONE site.
      url: https://arxiv.org/abs/2108.04961
      link_label: arXiv
    - title: The Impact of Digital Contact Tracing on the SARS-CoV-2 Pandemic
      year: 2021
      venue: EPJ Data Science
      text: Agent-based Monte Carlo modelling of an epidemic, applying particle-physics simulation methods to a public health question.
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8290404/
      link_label: link

