highlights:
  # Rendered as a template: {{ stats.* }} values are computed at build time.
  - >-
    **New measurements with neutrinos.** Proposed and developed the frameworks for
    measurements next-generation detectors were not designed for. These include leptonic
    CP violation with sub-GeV atmospheric neutrinos (Hyper-K, DUNE), atmospheric $\nu_\tau$
    appearance via neutral currents (JUNO), neutral-current solar neutrino detection
    (DUNE), and the cosmic-ray spectrum measured through atmospheric neutrinos.
  - >-
    **Dark matter and new physics with neutrino detectors.** New probes of dark matter
    captured in Jupiter and annihilating in the Galaxy, dark matter-nucleon
    interactions constrained by ultrahigh-energy cosmic-ray acceleration, stellar probes
    (white dwarfs, stars orbiting supermassive black holes), and the first
    neutrino-telescope limits on long-lived supersymmetric particles.
  - >-
    **Predictions that hold up at the detector level.** Former member of
    P-ONE and IceCube, where I provided the atmospheric-cascade and
    bioluminescence background models their analyses depend on. My phenomenology for Hyper-K, DUNE,
    JUNO, and KM3NeT is independent of those collaborations, but is built on that
    experience.
  - >-
    **Open tools.** Lead developer and maintainer of **Prometheus**, the open-source
    neutrino telescope simulation now used across the field, and author of
    **softpaws** (analytic neutrino-telescope effective areas), **Fennel** (light yields)
    and **bib-checker** (bibliography validation against INSPIRE).
  - >-
    **Independent visibility.** {{ stats.invited_talks }} invited talks and seminars,
    including Stanford, Harvard, Queen's, Texas A&M, Ohio State, UNSW, and the Mitchell
    Conference.
  - >-
    **Mentoring.** Supervised {{ stats.supervision.phd_words }} PhD student{{ 's' if stats.supervision.phd != 1 }},
    {{ stats.supervision.masters_words }} Master's students, and
    {{ stats.supervision.junior_words }} undergraduate or junior researchers. Graduate
    lecturer in dark matter direct detection. Organized the Melbourne theory seminar
    series.
  - >-
    **Funding and recognition.** Marie Curie Seal of Excellence (2021), Laby Early
    Career Researcher Award, and an ARC Centre of Excellence for Dark Matter ECR Special
    Initiatives grant.

