# Research page: one section per theme (`cv_title`/`cv_summary` are the shorter
# versions used in the CV's "Research Themes" section). Papers are attached automatically via the
# `themes:` tags in papers.yml; `highlights` pick a few to feature with a one-line
# result. Text uses light Markdown and $...$ math (e.g. $\nu_\tau$).
#   supporting: true -> shown as the method behind the main themes
#   minor: true      -> short section at the end, no highlights, not on the CV

intro: >-
  Next-generation neutrino detectors (JUNO, Hyper-Kamiokande, DUNE, and neutrino
  telescopes in water and ice) are built for a few headline measurements. **I find the
  measurements these detectors weren't designed for, and show they can make them.** My
  work has two main directions, new measurements with neutrinos and new probes of dark
  matter and physics beyond the Standard Model, supported by particle transport and open
  simulation tools that make the predictions credible at the detector level.

themes:
  - id: neutrino
    title: New measurements with neutrinos
    cv_title: Neutrino phenomenology and precision oscillation physics
    cv_summary: >-
      Leptonic CP violation with sub-GeV atmospheric neutrinos (targeting Hyper-K and DUNE), $\nu_\tau$ appearance (JUNO), solar neutrinos via neutral currents (DUNE), and the cosmic-ray spectrum measured through atmospheric neutrinos.
    summary: >-
      Low-energy atmospheric and solar neutrinos are still an underused resource for
      precision physics, mainly because current detectors lack the size and resolution
      to exploit them. JUNO, DUNE and Hyper-K change that, and each brings something
      unique. JUNO has carbon's efficient neutron capture, DUNE has nuclear transitions
      in argon, and Hyper-K has sheer size. I develop the predictions and analysis
      strategies that turn these features into new measurements, from leptonic CP
      violation with sub-GeV atmospheric neutrinos to $\nu_\tau$ appearance,
      neutral-current solar neutrinos, and the cosmic-ray spectrum itself.
    highlights:
      - paper: Beacom:2026mys
        result: Sub-GeV atmospheric neutrinos give competitive sensitivity to the CP-violating phase, independent of accelerator systematics.
      - paper: Meighen-Berger:2023xpr
        result: JUNO can be the first experiment to see atmospheric $\nu_\tau$ appearance, via sub-GeV neutral-current interactions.
      - paper: Meighen-Berger:2024xbx
        result: Neutral-current detection on argon substantially extends DUNE's solar neutrino reach.
      - paper: Meighen-Berger:2025pcq
        result: Next-generation neutrino detectors can measure the primary cosmic-ray spectrum precisely enough to distinguish between satellite measurements.

  - id: bsm
    title: Dark matter and new physics with neutrino detectors
    cv_title: Dark matter and beyond-the-Standard-Model physics
    cv_summary: >-
      Dark matter captured in Jupiter and annihilating in the Galaxy, dark matter-nucleon interactions probed through ultrahigh-energy cosmic-ray acceleration, stellar probes (white dwarfs, stars near supermassive black holes), and long-lived particles produced in air showers.
    summary: >-
      Neutrino detectors are also excellent detectors for new physics. I use them, and
      astrophysical systems more broadly, to constrain dark matter and new particles.
      Examples are dark matter captured in Jupiter or annihilating in the Galaxy, dark
      matter exchanging energy with stars near supermassive black holes, and new charged
      particles produced in air showers that reach the detector directly. A recent
      direction uses the very existence of ultrahigh-energy cosmic rays as a probe of
      dark matter-nucleon interactions.
    highlights:
      - paper: Meighen-Berger:2025hrq
        result: The observed UHECR spectrum constrains dark matter-nucleon scattering, since that scattering would spoil cosmic-ray acceleration.
      - paper: Robles:2024tdh
        result: Water Cherenkov detectors can probe dark matter captured in Jupiter, reaching beyond direct-detection experiments.
      - paper: Meighen-Berger:2020eun
        result: First neutrino-telescope limits on long-lived staus, competitive with collider searches.

  - id: tools
    supporting: true
    title: Particle transport and open simulation
    cv_title: Particle transport and open simulation
    cv_summary: >-
      Analytic muon transport and telescope effective areas (softpaws), atmospheric fluxes and cascades, and open, geometry-agnostic detector simulation (Prometheus, Fennel) with public benchmarks, built to make the phenomenology above testable before the detectors exist.
    summary: >-
      A proposed measurement is only useful if it survives realistic backgrounds and
      detector response. I work on the transport of particles and light through the
      atmosphere, the Earth and the detector, from electromagnetic cascades and
      atmospheric fluxes to analytic muon transport, and build it into open tools that
      any experiment can use. Prometheus provides end-to-end telescope simulation,
      softpaws computes effective areas, and Fennel calculates light yields.
    highlights:
      - paper: Lazar:2023rol
        result: The first public, end-to-end neutrino-telescope simulation, now a community baseline.
      - paper: Meighen-Berger:2026yls
        result: Telescope effective areas derived from muon transport, reproducing published detector responses and extending them to detectors not yet simulated.
      - paper: Orsoe:2025yru
        result: An open benchmark for deep-learning event reconstruction across neutrino telescopes.

  - id: side
    title: Side projects
    minor: true
    summary: >-
      The same Monte Carlo methods carry over to other fields. Modelling deep-sea
      bioluminescence, the optical background for ocean neutrino telescopes, grew into a
      study of bioluminescent life in the Pacific. During the pandemic, I applied them to
      an agent-based model of epidemic spread and digital contact tracing.
